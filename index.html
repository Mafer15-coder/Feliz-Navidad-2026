
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ferval | Navidad A-131REE</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #061b36;
      color: #f5dfab;
      font-family: Georgia, serif;
      text-align: center;
    }

    .contenido {
      width: 100%;
      max-width: 650px;
      margin: 0 auto;
    }

    .imagen {
      display: block;
      width: 100%;
      height: auto;
    }

    .musica {
      padding: 28px 15px 45px;
    }

    .musica p {
      font-size: 18px;
      margin-bottom: 20px;
    }

    .boton {
      display: inline-block;
      padding: 16px 28px;
      border: 1px solid #d9b76c;
      border-radius: 35px;
      background: #102b4b;
      color: #f5dfab;
      font-family: Georgia, serif;
      font-size: 17px;
      cursor: pointer;
    }

    .boton:active {
      background: #23476b;
    }

    .credito {
      margin-top: 25px;
      font-size: 11px !important;
      opacity: 0.65;
    }
  </style>
</head>

<body>

  <main class="contenido">

    <!-- Nuestra felicitación navideña -->
    <img
      class="imagen"
      src="./navidad-a131ree.png"
      alt="Felicitación navideña Ferval A-131REE"
    >

    <!-- Música navideña -->
    <section class="musica">

      <p>🎄 Una sorpresa musical para ti 🎄</p>

      <button
        class="boton"
        id="botonMusica"
        type="button"
      >
        🎵 Reproducir música
      </button>

      <audio
        id="audioNavidad"
        preload="none"
        loop
      >
        <source
          src="./navidad-mp3.ogg"
          type="audio/ogg"
        >
      </audio>

      <p class="credito">
        Música: Jason Shaw / Audionautix
      </p>

    </section>

  </main>

  <script>
    const audio = document.getElementById("audioNavidad");
    const boton = document.getElementById("botonMusica");

    boton.addEventListener("click", async function() {

      if (audio.paused) {
        try {
          await audio.play();
          boton.textContent = "⏸️ Pausar música";
        } catch (error) {
          boton.textContent = "No se pudo reproducir";
          alert(
            "Tu navegador no pudo reproducir el audio."
          );
        }
      } else {
        audio.pause();
        boton.textContent = "🎵 Reproducir música";
      }

    });

    audio.addEventListener("pause", function() {
      boton.textContent = "🎵 Reproducir música";
    });

    audio.addEventListener("play", function() {
      boton.textContent = "⏸️ Pausar música";
    });
  </script>

</body>
</html>
