
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ferval | Navidad A-131REE</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: #061b36;
      color: #f5dfab;
      font-family: Georgia, serif;
      text-align: center;
    }

    .contenido {
      width: 100%;
      max-width: 650px;
      margin: 0 auto;
    }

    .imagen {
      display: block;
      width: 100%;
      height: auto;
    }

    .musica {
      padding: 25px 15px 45px;
    }

    .boton {
      display: inline-block;
      padding: 16px 25px;
      border: 1px solid #d9b76c;
      border-radius: 35px;
      background: #102b4b;
      color: #f5dfab;
      text-decoration: none;
      font-size: 17px;
    }

    .boton:hover {
      background: #183d66;
    }
  </style>
</head>

<body>
  <main class="contenido">

    <img
      class="imagen"
      src="./navidad-a131ree.png"
      alt="Felicitación navideña Ferval A-131REE"
    >

    <section class="musica">
      <p>🎄 Una sorpresa musical para ti 🎄</p>

      <a
        class="boton"
        href="https://www.youtube.com/results?search_query=Carol+of+the+Bells+instrumental"
        target="_blank"
        rel="noopener noreferrer"
      >
        🎵 ¡Que suene la Navidad!
      </a>
    </section>

  </main>
</body>
</html>
